name: Preview & diff dashboards
description: |
  Run the `dac preview` and `dac diff` commands of percli to deploy ephemeral dashboards to the API server and to generate diffs
  between the local dashboards and their remote counterparts, then post a consolidated report of the dashboard changes as a
  comment in the pull-request, with the diffs published to the workflow run summary.
  **Note:** Login to an API server is required before running this action. You can use the provided `login` action for this purpose.
inputs:
  directory:
    description: Path to the directory containing the resources consumed by the command (mutually exclusive with `file`).
    required: false
  file:
    description: Path to the file that contains the resources consumed by the command (mutually exclusive with `directory`).
    required: false
  project:
    description: If present, the project scope for this CLI request.
    required: false
  create-project:
    description: If true, the projects encountered in resource definitions will be created if they do not already exist. /!\ It does not make sense to use this flag if the `project` input is provided.
    required: false
    default: true
  prefix:
    description: If provided, it is used to prefix the dashboard preview name.
    required: false
  ttl:
    description: Time To Live of the dashboard preview (default "1d").
    required: false
  skip-preview:
    description: Skip the dashboard preview stage if true.
    required: false
    default: false
  skip-diff:
    description: Skip the dashboard diff generation stage if true.
    required: false
    default: false
  comment:
    description: If true, the dashboard changes are posted as a comment in the pull-request.
    required: false
    default: true
runs:
  using: composite
  steps:
    - name: Run the `dac preview` command
      if: ${{ inputs.skip-preview != 'true' }}
      run: |
        percli dac preview \
          $([[ -n "${{ inputs.directory }}" ]] && echo "-d ${{ inputs.directory }}") \
          $([[ -n "${{ inputs.file }}" ]] && echo "-f ${{ inputs.file }}") \
          $([[ -n "${{ inputs.prefix }}" ]] && echo "--prefix ${{ inputs.prefix }}") \
          $([[ -n "${{ inputs.project }}" ]] && echo "--project ${{ inputs.project }}") \
          $([[ "${{ inputs.create-project }}" == "true" ]] && echo "--create-project") \
          $([[ -n "${{ inputs.ttl }}" ]] && echo "--ttl ${{ inputs.ttl }}") \
          -o json \
          > preview_output.json
      shell: bash

    - name: Run the `dac diff` command
      if: ${{ inputs.skip-diff != 'true' }}
      run: |
        percli dac diff \
          $([[ -n "${{ inputs.directory }}" ]] && echo "-d ${{ inputs.directory }}") \
          $([[ -n "${{ inputs.file }}" ]] && echo "-f ${{ inputs.file }}") \
          $([[ -n "${{ inputs.project }}" ]] && echo "--project ${{ inputs.project }}")
      shell: bash

    - name: Post the dashboard changes to the PR
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // Directory containing the diff files generated by the `dac diff` command
          const diffDir = './built';

          const previewRan = ${{ inputs.skip-preview != 'true' }};
          const diffRan = ${{ inputs.skip-diff != 'true' }};

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          // Truncate huge diffs to stay within the job summary size limits
          const maxDiffLength = 65000;

          // Compute the anchors of the job summary headings the same way GitHub does
          const summaryTitle = 'Dashboard diffs';
          const usedSlugs = new Map();
          const slugify = (text) => {
            const slug = text.toLowerCase().replace(/ /g, '-').replace(/[^a-z0-9_-]/g, '');
            const count = usedSlugs.get(slug) || 0;
            usedSlugs.set(slug, count + 1);
            return count === 0 ? slug : `${slug}-${count}`;
          };
          slugify(summaryTitle); // Reserve the slug of the summary title

          // Build the diff cell of a table row & collect the diff content for the job summary
          let diffsSummary = '';
          const buildDiffCell = (name, diffFile) => {
            if (!fs.existsSync(diffFile)) {
              return 'N/A';
            }
            let diffContent = fs.readFileSync(diffFile, 'utf-8').trim();
            if (!diffContent) {
              return 'No changes';
            }
            if (diffContent.length > maxDiffLength) {
              diffContent = `${diffContent.slice(0, maxDiffLength)}\n... (diff truncated)`;
            }
            diffsSummary += `### ${name}\n\n\`\`\`diff\n${diffContent}\n\`\`\`\n\n`;
            return `[Diff](${runUrl}#user-content-${slugify(name)})`;
          };

          // Build the table
          let header = '';
          const rows = [];
          if (previewRan) {
            const previews = JSON.parse(fs.readFileSync('preview_output.json', 'utf8')) || [];
            header =  `| Project | Dashboard | Status | Preview | Current |${diffRan ? ' Diff |' : ''}\n`;
            header += `|---------|-----------|--------|---------|---------|${diffRan ? '------|' : ''}`;
            for (const item of previews) {
              const hasCurrent = typeof item.current === 'string' && item.current.trim() !== '';
              const status = hasCurrent ? 'UPDATED' : 'NEW';
              const currentLink = hasCurrent ? `[Current](${item.current})` : 'N/A';
              let row = `| ${item.project} | ${item.dashboard} | ${status} | [Preview](${item.preview}) | ${currentLink} |`;
              if (diffRan) {
                // `percli dac diff` generates one `<project>-<dashboard>.diff` file per dashboard having a remote counterpart
                const name = `${item.project}-${item.dashboard}`;
                row += ` ${buildDiffCell(name, path.join(diffDir, `${name}.diff`))} |`;
              }
              rows.push(row);
            }
          } else if (diffRan) {
            // Without the preview data, list the generated diff files directly
            header =  `| Dashboard | Diff |\n`;
            header += `|-----------|------|`;
            for (const file of fs.readdirSync(diffDir).filter((f) => f.endsWith('.diff'))) {
              const name = path.basename(file, '.diff');
              rows.push(`| ${name} | ${buildDiffCell(name, path.join(diffDir, file))} |`);
            }
          }

          if (rows.length === 0) {
            console.log('No dashboard changes to comment.');
            return;
          }

          // Publish the diffs to the job summary, where the diff links of the comment redirect to
          if (diffsSummary) {
            await core.summary.addRaw(`## ${summaryTitle}\n\n${diffsSummary}`).write();
          }

          // Post the consolidated comment
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `### Dashboard changes\n\n${header}\n${rows.join('\n')}\n`
          });
