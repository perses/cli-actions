name: Reusable Workflow for Dashboard-as-Code CI/CD
on:
  workflow_call:
    inputs:
      # general:
      url:
        description: The URL of the Perses API server where to deploy the dashboard preview.
        type: string
        required: true
      directory:
        description: Path to the directory containing the dashboards as code (mutually exclusive with `file`).
        type: string
        required: false
      file:
        description: Path to the file that contains the dashboards as code (mutually exclusive with `directory`).
        type: string
        required: false
      project:
        description: If present, the project scope for this CLI request.
        type: string
        required: false
      create-project:
        description: If true, the projects encountered in resource definitions will be created if they do not already exist. /!\ It does not make sense to use this flag if the `project` input is provided.
        type: boolean
        default: true
        required: false
      cli-version:
        description: Version of percli to install. /!\ For this version of the workflow, the percli version should be at least v0.53.1 or higher
        type: string
        default: latest
        required: false
      runs-on:
        description: Label of the runner to execute the job on.
        type: string
        default: ubuntu-latest
        required: false
      go-version:
        description: Go version to install, e.g. "1.26.x".
        type: string
        default: 1.27.x
        required: false
      # skip:
      skip-preview:
        description: Skip the dashboard preview stage if provided.
        type: boolean
        required: false
      skip-diff:
        description: Skip the dashboard diff generation stage if provided.
        type: boolean
        required: false
      skip-deploy:
        description: Skip the dashboard deployment stage if provided.
        type: boolean
        required: false
      # auth:
      provider:
        description: External authentication provider identifier. (slug_id)
        type: string
        required: false
      insecure-skip-tls-verify:
        description: If true the server's certificate will not be checked for validity. This will make your HTTPS connections insecure.
        type: string
        required: false
      # validate-specific:
      server-validation:
        description: When enabled, requests the API to make additional validation.
        type: boolean
        required: false
      # preview-specific:
      ttl:
        description: Time To Live of the dashboard preview (default "1d").
        type: string
        required: false
      # deploy-specific:
      force:
        description: If present, dashboards will be deployed even if the projects are not consistent between the --project flag and the dashboards metadata (the latter has priority).
        type: boolean
        required: false
    secrets:
      username:
        description: Username for basic authentication to the API server.
        required: false
      password:
        description: Password for basic authentication to the API server.
        required: false
      token:
        description: Bearer token for authentication to the API server.
        required: false
      client-id:
        description: Client ID used for robotic access when using external authentication provider.
        required: false
      client-secret:
        description: Client Secret used for robotic access when using external authentication provider.
        required: false
      cue-token:
        description: Token for CUE's Central Registry.
        required: false

jobs:
  dac:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install necessary tools
        uses: perses/github-actions/actions/setup_environment@v0.13.0
        with:
          enable_go: true
          go_version: ${{ inputs.go-version }}
          enable_cue: true
          cue_version: "v0.16.1"

      - name: Retrieve workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@v1
        with:
          repository-name: perses/cli-actions
          file-name: dac.yaml

      - name: Check out actions using workflow version
        uses: actions/checkout@v4
        with:
          repository: perses/cli-actions
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: perses-cli-actions

      - name: Install percli
        uses: ./perses-cli-actions/actions/install_percli
        with:
          cli-version: ${{ inputs.cli-version }}

      - name: Build the dashboards
        uses: ./perses-cli-actions/actions/build_dac
        with:
          directory: ${{ inputs.directory }}
          file: ${{ inputs.file }}

      - name: Login to the API server
        uses: ./perses-cli-actions/actions/login
        with:
          url: ${{ inputs.url }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          token: ${{ secrets.token }}
          provider: ${{ inputs.provider }}
          client-id: ${{ secrets.client-id }}
          client-secret: ${{ secrets.client-secret }}
          insecure-skip-tls-verify: ${{ inputs.insecure-skip-tls-verify }}

      - name: Validate the dashboards
        uses: ./perses-cli-actions/actions/validate_resources
        with:
          directory: ./built
          online: ${{ inputs.server-validation }}

      - name: Preview the dashboards
        if: ${{ github.event_name == 'pull_request' && !inputs.skip-preview }}
        uses: ./perses-cli-actions/actions/preview_dashboards
        with:
          directory: ./built
          project: ${{ inputs.project }}
          create-project: ${{ inputs.create-project }}
          prefix: PR${{ github.event.pull_request.number }}
          ttl: ${{ inputs.ttl }}
          # Post an individual comment only when the diff stage is skipped, otherwise a consolidated comment is posted below.
          comment: ${{ inputs.skip-diff }}

      - name: Generate dashboards diffs
        if: ${{ github.event_name == 'pull_request' && !inputs.skip-diff }}
        uses: ./perses-cli-actions/actions/diff_dashboards
        with:
          directory: ./built
          project: ${{ inputs.project }}
          # Post an individual comment only when the preview stage is skipped, otherwise a consolidated comment is posted below.
          comment: ${{ inputs.skip-preview }}

      - name: Post the dashboard changes to the PR
        if: ${{ github.event_name == 'pull_request' && !inputs.skip-preview && !inputs.skip-diff }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Directory containing the diff files generated by the `dac diff` command
            const diffDir = './built';

            const previews = JSON.parse(fs.readFileSync('preview_output.json', 'utf8')) || [];

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Truncate huge diffs to stay within the job summary size limits
            const maxDiffLength = 65000;

            // Compute the anchors of the job summary headings the same way GitHub does
            const summaryTitle = 'Dashboard diffs';
            const usedSlugs = new Map();
            const slugify = (text) => {
              const slug = text.toLowerCase().replace(/ /g, '-').replace(/[^a-z0-9_-]/g, '');
              const count = usedSlugs.get(slug) || 0;
              usedSlugs.set(slug, count + 1);
              return count === 0 ? slug : `${slug}-${count}`;
            };
            slugify(summaryTitle); // Reserve the slug of the summary title

            // Build table header
            let table = `| Project | Dashboard | Status | Preview | Current | Diff |\n`;
            table +=    `|---------|-----------|--------|---------|---------|------|\n`;

            // Build table rows + the diffs content for the job summary
            let diffsSummary = '';
            for (const item of previews) {
              const hasCurrent = typeof item.current === 'string' && item.current.trim() !== '';
              const status = hasCurrent ? 'UPDATED' : 'NEW';
              const currentLink = hasCurrent ? `[Current](${item.current})` : 'N/A';

              // `percli dac diff` generates one `<project>-<dashboard>.diff` file per dashboard having a remote counterpart
              let diffLink = 'N/A';
              const diffFile = path.join(diffDir, `${item.project}-${item.dashboard}.diff`);
              if (fs.existsSync(diffFile)) {
                let diffContent = fs.readFileSync(diffFile, 'utf-8').trim();
                if (diffContent) {
                  if (diffContent.length > maxDiffLength) {
                    diffContent = `${diffContent.slice(0, maxDiffLength)}\n... (diff truncated)`;
                  }
                  const heading = `${item.project}-${item.dashboard}`;
                  diffsSummary += `### ${heading}\n\n\`\`\`diff\n${diffContent}\n\`\`\`\n\n`;
                  diffLink = `[Diff](${runUrl}#user-content-${slugify(heading)})`;
                } else {
                  diffLink = 'No changes';
                }
              }

              table += `| ${item.project} | ${item.dashboard} | ${status} | [Preview](${item.preview}) | ${currentLink} | ${diffLink} |\n`;
            }

            // Publish the diffs to the job summary, where the diff links of the comment redirect to
            if (diffsSummary) {
              await core.summary.addRaw(`## ${summaryTitle}\n\n${diffsSummary}`).write();
            }

            // Post the consolidated comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Dashboard changes\n\n${table}`
            });

      - name: Deploy the dashboards
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.skip-deploy }}
        uses: ./perses-cli-actions/actions/apply_resources
        with:
          directory: ./built
          project: ${{ inputs.project }}
          create-project: ${{ inputs.create-project }}
          force: ${{ inputs.force }}
